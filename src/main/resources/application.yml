spring:
    application:
        name: kdt-taskflow
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            pool-name: project-pool
            maximum-pool-size: 10
    flyway:
        enabled: true
        baseline-on-migrate: true
        repair-on-migrate: true

    logging:
        level:
            com.kdt.taskflow.mapper: debug

server:
    port: 8080
    address: 0.0.0.0

mybatis:
    type-aliases-package: com.kdt.taskflow.domain
    type-handlers-package: com.kdt.taskflow.mapper.typehandler
    mapper-locations: classpath:mapper/**/*.xml
    configuration:
        map-underscore-to-camel-case: true

jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

brevo:
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
    api-key: ${BREVO_API_KEY:}
    sender:
        name: ${BREVO_SENDER_NAME:Taskflow}
        email: ${BREVO_SENDER_EMAIL:kdttaskflow@gmail.com}

cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:bs5wxybt}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}